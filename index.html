<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cipher Key — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cipher Key · zero dependencies · github.com/veraetogrex-portfolio -->
  <section class="ck" id="cipher" aria-label="Encrypt a message with a key">
    <header class="ck-top">
      <div>
        <h1 class="ck-mode">Encryption</h1>
        <p class="ck-keyline">Key <b class="ck-keyhex"></b> <button class="ck-newkey" title="New random key" aria-label="New random key">↻</button></p>
      </div>
      <form class="ck-form">
        <label class="ck-label" for="ck-msg">Message</label>
        <input class="ck-input" id="ck-msg" maxlength="8" value="SECRET" autocomplete="off" spellcheck="false">
        <button class="ck-go" type="submit">Encrypt</button>
      </form>
    </header>

    <div class="ck-screen">
      <canvas class="ck-canvas" aria-hidden="true"></canvas>
      <div class="ck-scan" aria-hidden="true">
        <span class="ck-chip"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="12" r="4.5"/><path d="M12 12h10M18 12v4M21 12v3"/></svg>key</span>
      </div>
      <p class="ck-out" role="status"></p>
    </div>

    <p class="ck-caption">Plain text. Anyone can read it.</p>

    <div class="ck-readers">
      <div class="ck-reader ck-friend">
        <p class="ck-who"><i></i>Friend <span>has the key</span></p>
        <p class="ck-sees"></p>
      </div>
      <div class="ck-reader ck-spy">
        <p class="ck-who"><i></i>Eavesdropper <span>no key</span></p>
        <p class="ck-sees"></p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
